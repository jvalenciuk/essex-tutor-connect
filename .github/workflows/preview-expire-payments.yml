name: Expire unpaid Preview bookings every 15 minutes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-payment-expiration
  cancel-in-progress: false

jobs:
  expire-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call protected Preview expiration endpoint
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_CRON_SECRET" ] || [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing PREVIEW_CRON_SECRET or VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi
          # Hard-coded Preview branch URL: never call Production.
          PREVIEW_URL="https://we-learn-stripe-preview.vercel.app/api/cron/expire-payments"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $PREVIEW_CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PREVIEW_URL"

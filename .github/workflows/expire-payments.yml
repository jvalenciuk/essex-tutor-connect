name: Expire unpaid tutoring bookings

on:
  # Manual-only until the GitHub Actions CRON_SECRET matches the destination.
  # Production retains its separate daily Vercel Cron schedule.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call authenticated expiration endpoint
        env:
          EXPIRATION_URL: ${{ secrets.EXPIRATION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$EXPIRATION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure EXPIRATION_URL and CRON_SECRET as repository Actions secrets."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 5 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$EXPIRATION_URL"
